<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Reader</title>
<meta name="description" content="A fiery book reader with a rider that tracks your progress.">
<meta name="theme-color" content="#0b0708">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember Reader">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="night">

<div id="app">
  <header id="topbar">
    <h1 id="title">Ember Reader</h1>
    <button class="ib" id="btnZoomOut" aria-label="Zoom out">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
    </button>
    <button class="ib" id="btnZoomIn" aria-label="Zoom in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg>
    </button>
    <button class="ib" id="btnWarm" aria-label="Reading mode (warm light)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button class="ib" id="btnTheme" aria-label="Switch night / sun mode">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.8 6.8 0 0 0 20 14.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3L7 7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/></svg>
    </button>
    <button class="ib" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>

  <main id="stage">
    <div id="scroller" tabindex="-1">
      <div id="pageWrap"><canvas id="page" aria-label="Book page"></canvas></div>
    </div>

    <div id="slider" role="slider" tabindex="0" aria-label="Page slider" aria-orientation="vertical" aria-valuemin="1" aria-valuenow="1" aria-valuemax="1">
      <div class="rail"></div>
      <div class="fill"></div>
      <div class="thumb"></div>
      <div class="bubble">1</div>
    </div>
  </main>

  <footer id="tracker">
    <div class="meta">
      <button id="pageLabel" aria-label="Go to page">Page 1 / 1</button>
      <span id="pct">0%</span>
    </div>
    <div class="road" id="road">
      <div class="asphalt"></div>
      <div class="lit" id="lit"></div>
      <div class="dashes"></div>
      <div class="rider" id="rider">
        <div class="trail"></div>
        <img src="assets/rider.svg" alt="" draggable="false">
      </div>
    </div>
  </footer>
</div>

<!-- warm "reading mode" light over the whole screen -->
<div id="warm" aria-hidden="true"></div>

<div id="loading" hidden>
  <div class="spin"></div>
  <p id="loadText">Loading book…</p>
  <div class="bar"><div id="loadBar"></div></div>
</div>

<div id="error" hidden>
  <div class="card">
    <h2>Book not found</h2>
    <p id="errorText"></p>
    <label class="btn">Choose a PDF from this device
      <input type="file" id="fileErr" accept="application/pdf,.pdf" hidden>
    </label>
  </div>
</div>

<div id="sheet" hidden>
  <div class="backdrop" id="sheetBack"></div>
  <div class="panel" role="dialog" aria-label="Settings">
    <div class="grab"></div>
    <h2>Settings</h2>

    <div class="row">
      <span>Theme</span>
      <div class="seg" id="segTheme">
        <button data-v="night">🌙 Night</button>
        <button data-v="sun">☀️ Sun</button>
      </div>
    </div>

    <div class="row">
      <span>Reading mode<small>Warm yellow light, easier on the eyes</small></span>
      <label class="switch"><input type="checkbox" id="chkWarm"><i></i></label>
    </div>
    <div class="row col">
      <span>Warmth <small id="warmVal">25%</small></span>
      <input type="range" id="rngWarm" min="8" max="60" value="25">
    </div>

    <div class="row">
      <span>Dark pages at night<small>Turns white paper dark in Night mode</small></span>
      <label class="switch"><input type="checkbox" id="chkDark"><i></i></label>
    </div>

    <div class="row">
      <span>Open another PDF</span>
      <label class="btn sm">Choose…<input type="file" id="fileSet" accept="application/pdf,.pdf" hidden></label>
    </div>
    <div class="row">
      <span>Opening animation</span>
      <button class="btn sm" id="btnReplay">Replay</button>
    </div>
    <button class="btn full" id="btnClose">Done</button>
  </div>
</div>

<div id="intro" hidden>
  <canvas id="introCanvas"></canvas>
  <div id="introTitle"></div>
  <button id="skip">Skip ▸</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
